# Judge calibration: 15 hand-labelled bot turns. expected: pass = every criterion holds; fail = at least one
# does not. The judge's scores count only when it agrees with at least 14 of 15.
# Negatives are the bad replies from the live transcripts (CLAUDE.md, LIVE_TRANSCRIPT.txt, session 3).
items:
  - id: sunroof_not_understood
    state: "stage COLLECT_PROFILE. known: nothing. missing: group or occupation, base salary"
    bot: "מה קבוצת הזכאות שלכם (א-ד), או מה התפקיד שלכם? ומה שכר הבסיס החודשי שלכם?"
    user: "דבר ראשון אני רוצה לדעת האם יש אפשרות לרכב עם גג נפתח"
    reply: "לא הצלחתי להבין את התשובה.\n\nבמילים פשוטות: אני צריך לדעת לאיזה קבוצת רכב יש לכם זכאות, ומה שכר הבסיס שלכם."
    expected: fail
