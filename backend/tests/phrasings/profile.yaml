# הודעה אחת עם כל הפרופיל (או חלק ממנו), בתחילת השיחה.
setup: []
cases:
  - text: "אני מנהלת מוצר, שכר בסיס 18,500, אין עמלות ואין בונוס, פנסיה 6%, קרן השתלמות 2.5%, 2.75 נקודות זיכוי, 2 ילדים"
    allowed:
      - {occupation: "מנהל/ת מוצר", base: 18500, commissions: 0, bonus: 0, pension: 6, study_fund: 2.5,
         credit_points: 2.75, children: 2}
  # מהתרחיש הרשמי: עמלות משוערות נשמרות ומסומנות
  - text: "אני מנהלת מוצר, שכר בסיס 18,500, עמלות משתנות כ-1,000 ₪, פנסיה 6%, קרן השתלמות 2.5%, 2.25 נקודות זיכוי"
    allowed:
      - {occupation: "מנהל/ת מוצר", base: 18500, commissions: 1000, pension: 6, study_fund: 2.5,
         credit_points: 2.25, approximate: [commissions]}
  # מילה שהקורא לא מכיר → גיבוי: רק ערכים מתויגים
  - text: "שכר בסיס 18,500 ופנסיה 6%, ואני במשמרות"
    allowed: [{base: 18500, pension: 6}]
  - text: "מנהלת מוצר, שכר בסיס 18,500, ואני גם בהריון"
    allowed: [{base: 18500}, {occupation: "מנהל/ת מוצר", base: 18500}]
  - text: "מפתח תוכנה, שכר 22,000, פנסיה 7%, קרן השתלמות 2.5%"
    allowed: [{occupation: "מפתח/ת תוכנה", base: 22000, pension: 7, study_fund: 2.5}]
  - text: "שכר בסיס בערך 18"                     # מקוצר → שאלת אישור, לא הרחבה
    allowed: [{confirm: "base_salary=18000"}]
  - text: "שכר בסיס 18,500 בערך"
    allowed: [{base: 18500, approximate: [base_salary]}]
  - text: "שכר בסיס 18,500, פנסיה 60%"            # פנסיה מחוץ לטווח — לא נשמרת
    allowed: [{base: 18500}]
  - text: "מנהלת מוצר, שכר בסיס 18,500, אני לא בטוחה לגבי הפנסיה"
    allowed: [{occupation: "מנהל/ת מוצר", base: 18500}, {base: 18500}]
  - text: "שלום, אני רוצה לבדוק החלפת רכב"
    allowed: []
  - text: "אני מנהל פיתוח ומרוויח 25 אלף"
    allowed: [{occupation: "מנהל/ת פיתוח", base: 25000}, {occupation: "מנהל/ת פיתוח"}]
  - text: "מנהלת משאבי אנוש, 2 ילדים, 2.25 נקודות זיכוי"
    allowed: [{occupation: "מנהל/ת משאבי אנוש", children: 2, credit_points: 2.25}]
  - text: "שכר 18,500, עמלות 0, בונוס 0"
    allowed: [{base: 18500, commissions: 0, bonus: 0}]
  - text: "אין עמלות, אין בונוס, אין קרן השתלמות"
    allowed: [{commissions: 0, bonus: 0, study_fund: 0}]
  - text: "שכר בסיס 18,500 נטו"                    # נטו אינו שכר בסיס
    allowed: []
  - text: "פנסיה 6% או 7%, לא זוכרת"
    allowed: []
  - text: "3 ילדים, אחד מעל 23"                    # מסייג את מספר הילדים
    allowed: [{children: 2}]
  - text: "לא מנהלת מוצר, אני מפתחת תוכנה, שכר 20,000"
    allowed: [{occupation: "מפתח/ת תוכנה", base: 20000}, {base: 20000}]
  - text: "מנהלת מוצר עם קורולה קרוס, שכר 18,500"
    allowed: [{occupation: "מנהל/ת מוצר", base: 18500}, {base: 18500}]     # בגיבוי: רק המתויג
