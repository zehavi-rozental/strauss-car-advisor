# שאלת התפקיד (ההודעה הראשונה). שאלה חוזרת — תמיד מותרת.
setup: []
cases:
  - text: "מנהלת מוצר"
    allowed: [{occupation: "מנהל/ת מוצר"}]
  - text: "מנהל מוצר"
    allowed: [{occupation: "מנהל/ת מוצר"}]
  - text: "אני מנהלת מוצר"
    allowed: [{occupation: "מנהל/ת מוצר"}]
  - text: "מפתחת תוכנה"
    allowed: [{occupation: "מפתח/ת תוכנה"}]
  - text: "אני מפתח תוכנה בצוות הדאטה"
    allowed: [{occupation: "מפתח/ת תוכנה"}]
  - text: "נציג מכירות שטח"
    allowed: [{occupation: "נציג/ת מכירות שטח"}]
  - text: "מנהל מחלקה"
    allowed: [{occupation: "מנהל/ת מחלקה"}]
  - text: "טכנאית שירות"
    allowed: [{occupation: "טכנאי/ת שירות"}]
  - text: "רכזת רכש"
    allowed: [{occupation: "רכז/ת רכש"}]
  - text: "נהג הפצה"
    allowed: [{occupation: "נהג/ת הפצה"}]
  - text: "מהנדסת תהליך במפעל"
    allowed: [{occupation: "מהנדס/ת תהליך"}]
  - text: "מנהלת מוצרר"                       # שגיאת הקלדה
    allowed: [{occupation: "מנהל/ת מוצר"}, {confirm_occupation: "מנהלת מוצרר"}]
  - text: "קופאית"                            # לא בטבלה → לא נשמר; שואלים אם זה התפקיד
    allowed: [{confirm_occupation: "קופאית"}]
  - text: "מנהלת מוצרים"                      # כמעט בטבלה → מציעים את "מנהל/ת מוצר", לא מנחשים
    allowed: [{confirm_occupation: "מנהלת מוצרים"}]
  - text: "עובדת במשאבי אנוש"                 # לא "מנהלת" — אסור להתאים למנהל/ת משאבי אנוש
    allowed: [{confirm_occupation: "עובדת במשאבי אנוש"}]
  - text: "לא יודעת"
    allowed: []
  - text: "אני לא מנהלת מוצר"
    allowed: []
  - text: "שלום"
    allowed: []
  - text: "מה זה משנה?"
    allowed: []
  - text: "אנליסטית נתונים, שכר 15,000"
    allowed: [{occupation: "אנליסט/ית נתונים", base: 15000}, {occupation: "אנליסט/ית נתונים"}]
