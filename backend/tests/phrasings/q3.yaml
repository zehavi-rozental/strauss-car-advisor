# שאלה 3 של התרחיש הרשמי: הרכב היום וההשתתפות, והחלופות — ועוד מה שנשאר מ-Q2 (בונוס, ילדים).
# הודעה אחת יכולה לענות על הכול; הקורא פועל רק כשקרא אותה במלואה.
setup: ["קבוצה ג, 14,200 ₪", "עמלות משתנות כ-1,000 ₪, פנסיה 6%, קרן השתלמות 2.5%, 2.25 נקודות זיכוי. ויש לי היום רכב חברה."]
cases:
  - text: "אין בונוס, 2 ילדים, יש לי קורולה קרוס ואני משתתפת ב-300"
    allowed: [{bonus: 0, children: 2, car: CAR-09, copay: 300}]
  - text: "יש לי קורולה קרוס ואני משתתפת ב-300, אין בונוס, 2 ילדים"
    allowed: [{bonus: 0, children: 2, car: CAR-09, copay: 300}]
  - text: "אין בונוס ואין ילדים. יש לי קורולה קרוס, משתתפת ב-300 ש\"ח"
    allowed: [{bonus: 0, children: 0, car: CAR-09, copay: 300}]
  - text: "בונוס 2,000, 3 ילדים, נוהגת בקורולה קרוס 2023"
    allowed: [{bonus: 2000, children: 3, car: "tax:COROLLA CROSS (2023)"}, {bonus: 2000, children: 3, car: CAR-09}]
  - {text: "אין בונוס, 2 ילדים", allowed: [{bonus: 0, children: 2}]}
  - text: "יש לי קורולה קרוס, ואני משתתפת היום ב-300 ש\"ח בחודש"
    allowed: [{car: CAR-09, copay: 300}]
  - {text: "אין לי רכב", allowed: [{car: none}]}
  - text: "אין בונוס, 2 ילדים, ואין לי רכב"
    allowed: [{bonus: 0, children: 2, car: none}, {bonus: 0, children: 2}]
  - {text: "אין בונוס, 2 ילדים, יש לי קורולה קרוס הלבנה", allowed: []}       # "הלבנה" — לא נקרא במלואו
  - {text: "אין בונוס, 2 ילדים, זה לא קורולה קרוס", allowed: []}
  - {text: "בונוס בערך 2,000, יש לי קורולה קרוס", allowed: [{bonus: 2000, approximate: [bonus, commissions], car: CAR-09}]}
  - {text: "יש לי קורולה קרוס או קורולה, לא זוכרת", allowed: []}
  - {text: "אין בונוס, 2 ילדים, הרכב של אשתי קורולה קרוס", allowed: [{bonus: 0, children: 2}]}
  - {text: "קורולה קרוס ו-ATTO 3, אין בונוס", allowed: []}
  - {text: "300", allowed: [{copay: 300}]}
  # הרכב של היום או חלופה: נקבע לפי מילים (car_role_cues); שם רכב לבד — שואלים
  - {text: "ATTO 3", allowed: [{clarify: CAR-10}]}
  - {text: "אטו 3", allowed: [{clarify: CAR-10}]}
  - {text: "אני רוצה לבדוק ATTO 3", allowed: [{selected: [CAR-10]}]}
  - {text: "ATTO 3 מעניין אותי", allowed: [{selected: [CAR-10]}]}
  - {text: "רוצה לעבור לאטו 3", allowed: [{selected: [CAR-10]}]}
  - {text: "יש לי ATTO 3", allowed: [{car: CAR-10}]}
  - {text: "אני נוהגת ב-ATTO 3", allowed: [{car: CAR-10}]}
  - {text: "הרכב שלי ATTO 3, משתתפת ב-500", allowed: [{car: CAR-10, copay: 500}]}
  - text: "יש לי קורולה קרוס ורוצה לבדוק ATTO 3"
    allowed: [{car: CAR-09, selected: [CAR-10]}]
  - text: "אין בונוס, 2 ילדים, יש לי קורולה קרוס, משתתפת ב-300, ורוצה לבדוק ATTO 3"
    allowed: [{bonus: 0, children: 2, car: CAR-09, copay: 300, selected: [CAR-10]}]
  - {text: "אין בונוס, 2 ילדים, ATTO 3", allowed: [{bonus: 0, children: 2, clarify: CAR-10}]}
  - {text: "יש לי ATTO 3 ואני רוצה לבדוק אותו", allowed: []}               # שתי המילים לאותו רכב — לא מנחשים
  - {text: "קורולה קרוס, אין לי השתתפות", allowed: [{car: CAR-09, copay: 0}]}
  - {text: "קורולה קרוס 2023", allowed: [{car: "tax:COROLLA CROSS (2023)"}]}  # שנה אחרת מהקטלוג — הרכב של היום
  - {text: "רוצה לבדוק מודל 3", allowed: []}                              # קבוצה ד — לא זמין
