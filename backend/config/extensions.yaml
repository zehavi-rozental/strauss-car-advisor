# extensions.yaml — רק מה שקובץ הכללים של שטראוס (strauss-rules.json) עדיין לא מפרט.
# פנסיה, בסיס ההפרשות, השתתפות ועיגול — בקובץ הכללים (netMethod), לא כאן.
# כל ערך כאן הוא החלטה מתועדת (סעיף 11 באיפיון); תשובה משטראוס = שינוי ערך, לא קוד.
version: "ext-2026-10-20.1"

family_gap_adds_to_copay: true          # חלק העובד בפער מתווסף להשתתפות הרכב
copay_policy: CATALOG_DEFAULT_CONFIRM_ASYNC   # סעיף 8
plug_in_counts_as_electric: false
# "להעלות תלוש" link, offered next to a field the employee does not know.
# payslip_upload_enabled: true turns on the built-in in-chat uploader (needs the backend PAYSLIP_ENABLED
# + a Gemini key). payslip_upload_url: an external pilot page instead (a non-empty URL implies the link,
# and the client opens it in a new tab). Both default off, no code change to turn on.
payslip_upload_enabled: true
payslip_upload_url: ""
child_age_inclusive: true               # "עד גיל 23" כולל 23
default_vehicle_type: "1"               # בקטלוג אין עמודת סוג רכב
electric_fuel_codes: ["4"]              # זיהוי חשמלי לרכב נוכחי שאינו בקטלוג

# מילים שמותר שיישארו בהודעה על הרכב הנוכחי מלבד שם הדגם, השנה וההשתתפות.
# מילה אחרת ("קרוסאובר", "הגבוהה", "של טויוטה") → ההודעה עוברת למודל השפה. אות ו/ה/ב/ל לפני מילה — מותרת.
# "לא" בכוונה לא כאן: מותר רק כמילה ראשונה (תיקון); בכל מקום אחר הוא שולל את הרכב.
car_message_fillers: [יש, לי, שלי, הרכב, רכב, זה, זו, זאת, אני, נוהג, נוהגת, היום, חודש, בחודש, לחודש,
                      כל, שח, שקל, שקלים, כן, בעצם, טעות, סליחה, דווקא, עליו, עליה]

# מילים שמסמנות תיקון של הרכב הנוכחי ("התבלבלתי, זו קורולה קרוס"). נספרות באחת משלוש המילים הראשונות;
# בבדיקת המילים הנותרות הן נחשבות מילות מילוי.
correction_cues: [לא, סליחה, טעות, טעיתי, בעצם, רגע, התכוונתי, התבלבלתי, אופס, תיקון]

# הקורא פועל רק כשלא נשאר בהודעה דבר מעבר למה שזיהה (שמות, מספרים, מילים מוכרות) ולמילות המילוי של השאלה.
# אחרת — מודל השפה, ואם אין, שאלה חוזרת. אות ו/ה/ב/ל לפני מילה — מותרת.
profile_fillers: [אני, שלי, יש, לי, עם, גם, של, קרן, בחודש, לחודש, חודש, ברוטו, שח, שקל, שקלים, אחוז, אחוזים,
                  מהשכר, עד, גיל, עובד, עובדת, בתור, זה, היום, כרגע, תפקיד, התפקיד, מרוויח, מרוויחה, מקבל, מקבלת,
                  רכב, חברה, צמוד]
answer_fillers: [שח, שקל, שקלים, אחוז, אחוזים, בחודש, לחודש, חודש, בדיוק, ברוטו, בתלוש, יש, לי, זה, אני, כן,
                 קבוצה, קבוצת, זכאות, הוא, היא, שלי]
# בשאלת החלופות "יש לי" ומשפט השתתפות אינם מילוי: הם מדברים על הרכב הנוכחי
# מילה מיד אחרי ערך מתויג שמשנה את משמעותו ("שכר בסיס 18,500 נטו", "בונוס 12,000 בשנה"): הגיבוי לא רושם אותו.
value_qualifiers: [נטו, שנתי, שנתית, בשנה, לשנה, ברבעון, רבעוני, מהמעסיק, מעסיק, לפני, אחרי, חד-פעמי, פעם]
# תשובה קצרה לשאלת התפקיד שאינה בטבלה נרשמת כשם התפקיד (גיבוי). מילים אלה — ברכה או שאלה — אינן תפקיד.
non_title_words: [שלום, היי, הי, הלו, בוקר, ערב, טוב, תודה, מה, למה, איך, כמה, מי, מתי, איפה, רוצה, לבדוק, עזרה]
option_message_fillers: [אני, לי, רוצה, לבדוק, תבדוק, בדוק, את, גם, בבקשה, השוואה, להשוות, תשווה, מול, עם, אפשר,
                         חלופה, חלופות, של, רכב, הרכב, זה, ו, אותי]
# שאלה 3 שואלת על הרכב של היום ועל החלופות יחד, ולכן רכב בשמו אינו מעיד על תפקידו. מילה מהרשימה נקשרת
# לרכב הראשון אחריה באותו משפט-משנה (ואם אין — לרכב שלפניה). רכב בלי מילה, או עם מילים משתי הרשימות,
# כשהרכב של היום עוד לא ידוע — הבוט שואל. מילה שמסתיימת באות אחת ("לעבור ל") — האות צמודה לשם הרכב.
car_role_cues:
  current: [יש לי, הרכב שלי, היום, נוהג, נוהגת, משתתף, משתתפת, משלם, משלמת]
  alternative: [רוצה, מעניין, מעניינת, לבדוק, לעבור ל, להשוות, חלופה]
manufacturer_brands:
  "בי ווי די": [BYD, ביד]
  "טויוטה": [TOYOTA, טויוטה]
  "קיה": [KIA, קיה]
  "יונדאי": [HYUNDAI, יונדאי]
  "מזדה": [MAZDA, מזדה]
  "טסלה": [TESLA, טסלה]
  "סקודה": [SKODA, סקודה]
  "סיאט": [SEAT, סיאט]
  "מ.ג": [MG]

# טווחים סבירים (min, max) לכל ערך בפרופיל — נבדקים בקוד לכל מקור (הקורא, מודל השפה, כפתורים).
# ערך מחוץ לטווח לא נשמר; סכום מקוצר ("18" לשכר) לא מורחב — הבוט שואל "התכוונת ל-18,000 ₪?".
value_ranges:
  base_salary: [3000, 200000]
  commissions: [0, 200000]
  bonus: [0, 200000]
  pension_percent: [0, 7]
  study_fund_percent: [0, 2.5]
  credit_points: [0, 12]
  children_under_23: [0, 15]
  current_use_value: [0, 20000]
  current_copay: [0, 10000]
  current_maintenance: [0, 10000]

# Monthly amounts this small are almost always shorthand ("3" for 3,000): asked "3 ₪ או 3,000 ₪?",
# never saved or multiplied silently.
small_amount_below:
  commissions: 100
  bonus: 100
  current_use_value: 100        # a use value of "4" is 4,000 on the payslip
  current_maintenance: 100
  current_copay: 10             # copays are typically a few hundred; 1-9 is shorthand ("3" for 3,000)

# Phrases that ask for one question at a time; kept in the conversation state until "pace_reset_cues".
pace_cues: [שאלה אחת כל פעם, שאלה אחת בכל פעם, אחד אחד, אחת אחת, לא ביחד, לאט, אחד כל פעם, אחת כל פעם]

# Phrases that ask to answer a question later ("את השכר אבדוק אחר כך"). The field is postponed, not
# dropped and never defaulted: the bot keeps asking other things and brings it back when nothing else is
# askable or a calculation needs it. A value given later clears the deferral. New phrase = a line here.
# Note: deliberately NOT "להמשיך"/"נמשיך בלי"/"נתקדם" alone — those are the rep-offer "continue without
# asking the representative" answer, not a request to postpone a data field.
defer_cues: [אחר כך, "אח\"כ", אחכ, אחרי זה, בהמשך, מאוחר יותר, נחזור לזה, נחזור אליו, נחזור אל זה,
             לא עכשיו, עוד מעט, בינתיים, תשאל אחר כך, תשאלו אחר כך, תשאל אותי אחר כך, תשאל אותי בינתיים,
             אבדוק אחר כך, אבדוק בהמשך, אבדוק מאוחר יותר, אשלים אחר כך, אשלים בהמשך,
             אמסור אחר כך, אמסור בהמשך, אביא בהמשך, דלג על, תדלג, לדלג על, נדלג]
# A request about the conversation itself ("give me all the questions at once"): answered in one line from the
# bot's own design, never a question for the transport representative.
# A zero the employee said: only with one of these (or the digit 0) may a model save 0 for a field. A bare "לא"
# is not a cue ("לא יודע" is not zero). Missing is never zero.
zero_cues: [אין, בלי, ללא, אפס, אינני, איני, לא משלם, לא משלמת, לא משתתף, לא משתתפת, לא מקבל, לא מקבלת,
            לא קיבלתי, חינם]
all_at_once_cues: [כל השאלות בפעם אחת, כל השאלות ביחד, כל השאלות יחד, את כל השאלות, כל השאלות במכה, אמלא הכל ביחד,
                   אמלא הכול ביחד, אמלא הכל בבת אחת, אמלא הכול בבת אחת, בבת אחת, רשימת השאלות]
pace_reset_cues: [הכול ביחד, הכל ביחד, כמה שאלות ביחד]

# ערכים חוקיים אבל נדירים שמשפיעים חזק על הנטו: נשאלים פעם אחת ("לאשר / לתקן"), אף פעם לא ברירת מחדל.
# at_most: הערך הזה ומטה; at_least: הערך הזה ומעלה.
unusual_values:
  pension_percent: {at_most: 0}
  credit_points: {at_most: 0}
  base_salary: {at_most: 6000}
  children_under_23: {at_least: 9}

# כינויים בעברית לרכבי הקטלוג (לפי מזהה), לזיהוי הרכב הנוכחי ולבחירת חלופות.
# כינוי חדש = שורה כאן, לא קוד. ההתאמה מתעלמת מרווחים ומסימנים.
car_aliases:
  CAR-01: ["פיקנטו"]
  CAR-02: ["יאריס קרוס", "יאריס"]
  CAR-03: ["דולפין", "ביד דולפין"]
  CAR-04: ["לאון"]
  CAR-05: ["נירו"]
  CAR-06: ["אם ג'י 4", "אמג'י 4"]
  CAR-07: ["קורולה"]
  CAR-08: ["קונה", "קונה חשמלית"]
  CAR-09: ["קורולה קרוס"]
  CAR-10: ["אטו 3", "אטו"]
  CAR-11: ["אי וי 3"]
  CAR-12: ["טוסון"]
  CAR-13: ["מאזדה 3", "מזדה 3"]
  CAR-14: ["מודל 3", "טסלה"]
  CAR-15: ["אוקטביה"]
  CAR-16: ["ספורטאז'", "ספורטג'"]
  CAR-17: ["סיל"]
  CAR-18: ["ראב 4"]
  CAR-19: ["קרניבל"]
  CAR-20: ["סנטה פה"]
