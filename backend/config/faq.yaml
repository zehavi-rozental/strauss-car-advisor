# faq.yaml — the only source for answers to the employee's questions ("מה זה נקודות זיכוי?").
# The bot answers from these entries only. A question no entry covers gets an honest "I don't know"
# and the button "לשאול את נציג התחבורה".
# Numbers are never written here: {placeholders} are filled from strauss-rules.json when loading,
# so a rules change updates the answers too. Placeholders: electric_net_bonus, credit_point_value,
# family_min_children, child_max_age, family_gap_percent, groups, max_options.
# Fields: id, term (the words a reply must contain), aliases (how employees ask; typos are tolerated),
# answer (1-2 short lines), simple (re-explaining the question), example (what to type).
version: "faq-2026-10-18.1"

entries:
  - id: occupation
    term: קבוצת זכאות
    aliases: [קבוצת זכאות, קבוצה, תפקיד, מה הקבוצה שלי, איזו קבוצה]
    answer: "קבוצת הזכאות ({groups}) קובעת לאיזה רכבים יש לכם זכאות. אם היא לא ידועה, אפשר לכתוב את התפקיד ואמצא את הקבוצה."
    simple: "אני צריך לדעת לאיזה קבוצת רכב יש לכם זכאות, ומה שכר הבסיס שלכם."
    example: "קבוצה ג, שכר בסיס 18,500"
  - id: base
    term: שכר בסיס
    aliases: [שכר בסיס, ברוטו, משכורת, שכר]
    answer: "שכר הבסיס הוא השכר החודשי ברוטו, לפני עמלות ובונוסים. הוא מופיע בתלוש בשורת שכר יסוד."
    simple: "כמה שכר בסיס ברוטו מופיע בתלוש שלכם בכל חודש."
    example: "שכר בסיס 18,500"
  - id: commissions
    term: עמלות
    aliases: [עמלות, עמלה]
    answer: "עמלות הן תוספת חודשית לפי מכירות. אם הן משתנות, אפשר לכתוב סכום ממוצע ואסמן שזו הערכה."
    simple: "כמה כסף נוסף על הבסיס מקבלים בחודש: עמלות ובונוס. אם אין, כתבו אין."
    example: "עמלות 1,000, אין בונוס"
    where: "בתלוש, בשורת העמלות. אם הן משתנות, אפשר סכום ממוצע של החודשים האחרונים."
  - id: bonus
    term: בונוס
    aliases: [בונוס, בונוסים, פרמיה]
    answer: "בונוס הוא תוספת קבועה או ממוצעת לחודש. בונוס שנתי חד-פעמי לא נכלל כאן."
    simple: "כמה בונוס חודשי יש לכם. אם אין, כתבו אין."
    example: "בונוס 500, או: אין"
    where: "בתלוש, בשורת הבונוס או הפרמיה החודשית."
  - id: pension_percent
    term: פנסיה
    aliases: [פנסיה, הפרשה לפנסיה, אחוז פנסיה]
    answer: "זה האחוז שיורד לכם מהשכר לפנסיה, חלק העובד. בדרך כלל הוא מופיע בתלוש ליד ניכוי קרן הפנסיה."
    simple: "כמה אחוזים יורדים מהשכר שלכם לפנסיה."
    example: "פנסיה 6%"
    where: "בתלוש, בניכויים: קרן פנסיה, חלק העובד באחוזים."
  - id: study_fund_percent
    term: קרן השתלמות
    aliases: [קרן השתלמות, השתלמות, קה"ש]
    answer: "זה האחוז שיורד לכם מהשכר לקרן השתלמות, חלק העובד. אם אין לכם קרן, כתבו אין."
    simple: "כמה אחוזים יורדים מהשכר שלכם לקרן השתלמות. אם אין, כתבו אין."
    example: "קרן השתלמות 2.5%, או: אין"
    where: "בתלוש, בניכויים: קרן השתלמות, חלק העובד באחוזים."
  - id: credit_points
    term: נקודות זיכוי
    aliases: [נקודות זיכוי, נקודות, נקודת זיכוי, זיכוי]
    answer: "נקודות זיכוי מקטינות את מס ההכנסה. כל נקודה שווה {credit_point_value} ₪ בחודש. מספר הנקודות מופיע בתלוש."
    simple: "כמה נקודות זיכוי מופיעות בתלוש שלכם."
    example: "2.75 נקודות זיכוי"
    where: "בתלוש, בשורה נקודות זיכוי."
  - id: children
    term: ילדים
    aliases: [ילדים, ילד, מסלול משפחתי ילדים]
    answer: "אני שואל על ילדים עד גיל {child_max_age}, כי ממספר הילדים נקבעת הזכאות למסלול המשפחתי."
    simple: "כמה ילדים עד גיל {child_max_age} יש לכם. אם אין, כתבו אין."
    example: "2 ילדים, או: אין"
    where: "זה לא בתלוש: מספר הילדים שלכם עד גיל {child_max_age}."
  - id: car
    term: הרכב
    aliases: [איזה רכב, דגם, שנת רישום]
    answer: "אני צריך את דגם הרכב הצמוד שלכם היום, ואם אפשר גם את שנת הרישום. ממנו נלקח שווי השימוש."
    simple: "איזה רכב צמוד יש לכם עכשיו, וכמה משלמים עליו בחודש."
    example: "קורולה קרוס 2025, משלמת 300"
  - id: copay
    term: השתתפות
    aliases: [השתתפות, השתתפות עצמית, משתתף, משלם על הרכב]
    answer: "השתתפות היא הסכום שיורד לכם מהנטו בכל חודש עבור הרכב. אם היא לא ידועה, כתבו לא ידוע ואשאל את נציג התחבורה."
    simple: "כמה יורד לכם מהמשכורת בכל חודש עבור הרכב. אם לא ידוע, כתבו לא ידוע."
    example: "300, או: לא ידוע"
  - id: use_value
    term: שווי שימוש
    aliases: [שווי שימוש, שווי, שווי רכב]
    answer: "שווי שימוש הוא סכום שמתווסף לשכר לצורך מס, כי הרכב הוא הטבה. הוא לא כסף שמקבלים, אבל מגדיל את המס."
    simple: "כמה שווי שימוש מופיע בתלוש שלכם. אם לא ידוע, כתבו לא ידוע."
    example: "4000, או: לא ידוע"
  - id: drive
    term: הנעה
    aliases: [הנעה, סוג הנעה, היברידי, חשמלי]
    answer: "סוג ההנעה משפיע על שווי השימוש ועל החזר החשמל. האפשרויות: בנזין, היברידי, פלאג-אין או חשמלי."
    simple: "האם הרכב בנזין, היברידי, פלאג-אין או חשמלי."
    example: "היברידי"
  - id: maintenance
    term: אחזקת רכב
    aliases: [אחזקת רכב, אחזקה, החזר הוצאות רכב]
    answer: "אחזקת רכב היא תשלום חודשי בתלוש למי שאין לו רכב צמוד. היא חייבת במס."
    simple: "כמה אחזקת רכב מופיעה בתלוש שלכם בכל חודש."
    example: "1500"
  - id: options
    term: רכבים
    aliases: [אילו רכבים, איזה רכבים, רשימת רכבים, אפשרויות, חלופות]
    answer: "אפשר להשוות עד {max_options} רכבים מהקבוצה שלכם ומטה. אפשר גם לבקש את הכי משתלם."
    simple: "אילו רכבים לבדוק במקום הרכב של היום. אפשר לכתוב שמות, או: הכי משתלם."
    example: "אטו 3 ו-MG4, או: הכי משתלם"
  - id: electric
    term: החזר חשמל
    aliases: [החזר חשמל, רכב חשמלי, חשמל, טעינה]
    answer: "ברכב חשמלי מתווסף החזר חשמל, כך שהנטו גדל ב-{electric_net_bonus} ₪ בדיוק. המעסיק משלם את המס עליו."
  - id: family_track
    term: מסלול המשפחתי
    aliases: [מסלול משפחתי, רכב משפחתי, קרניבל, סנטה פה, 7 מקומות]
    answer: "עם {family_min_children} ילדים או יותר עד גיל {child_max_age} יש זכאות למסלול המשפחתי. על הפער מעל תקציב הקבוצה משלמים {family_gap_percent}%, והשאר על המעסיק."
  - id: opt_out
    term: ויתור
    aliases: [ויתור, לוותר, בלי רכב, לוותר על הרכב]
    answer: "בחלק מהתפקידים מותר לוותר על הרכב ולקבל במקומו אחזקת רכב. זה תלוי בתפקיד, ואפשר להשוות את זה כחלופה."
  - id: exact_amount
    term: הערכה
    aliases: [סכום מדויק, מספר מדויק, צריך מדויק, חייב מדויק, צריך בדיוק, אפשר בערך, בערך מספיק, הערכה מספיקה, משוער]
    answer: "לא חייב מדויק. אפשר לכתוב בערך, ואסמן בתוצאה שזו הערכה."
  - id: payslip
    term: תלוש
    aliases: [תלוש, איפה רואים, איפה זה מופיע, איפה מוצאים, תלוש שכר]
    answer: "רוב הנתונים מופיעים בתלוש השכר החודשי: שכר יסוד, ניכויים לפנסיה ולקרן השתלמות, ונקודות זיכוי."
  - id: why_ask
    term: כדי לחשב
    aliases: [למה אתה צריך, למה צריך, למה שואלים, בשביל מה, למה זה חשוב, למה אתם צריכים]
    answer: "הנתונים נחוצים כדי לחשב את הנטו לפי כללי החברה. בלי הנתון הזה החישוב לא יהיה נכון."
  - id: privacy
    term: פרטיות
    aliases: [פרטיות, מי רואה, מי יראה, נשמר, סודי, דיסקרטי, הנציג רואה]
    answer: "הפרטיות שלכם שמורה: נציג התחבורה לא רואה את השכר שלכם, ותעודת זהות לא נשמרת. הנציג רואה רק את הקבוצה ואת הרכב."
  - id: net
    term: נטו
    aliases: [נטו, מה זה נטו, כמה אקבל, כמה ארוויח, כמה ירד לי, איך מחשבים]
    answer: "אני מחשב כמה הנטו החודשי שלכם ישתנה כשמחליפים רכב, לפי כללי החברה. החישוב נעשה בקוד, לא בהערכה."
  - id: capabilities
    term: לעזור
    aliases: [מה אתה יודע, מה אפשר, מה אתה עושה, במה אתה עוזר, מי אתה]
    answer: "אני יכול לעזור לחשב איך החלפת הרכב הצמוד תשפיע על הנטו שלכם. אני לא מאשר רכבים ולא משנה שכר. לזה יש את נציג התחבורה."
  - id: rep
    term: נציג התחבורה
    aliases: [נציג, נציג תחבורה, לדבר עם נציג, בן אדם, אדם אמיתי]
    answer: "נציג התחבורה עונה על מה שאין לי מידע עליו. אשאל אותו כשצריך, והתשובה תגיע לכאן."
  - id: waiting
    term: נציג
    aliases: [יש תשובה, מתי תהיה תשובה, מתי יענה, כמה זמן, עוד הרבה זמן, מתי הנציג]
    answer: "התשובה של נציג התחבורה תופיע כאן ברגע שתגיע. אין צורך להישאר במסך."
  - id: new_chat
    term: שיחה חדשה
    aliases: [להתחיל מחדש, שיחה חדשה, מההתחלה, איפוס]
    answer: "כדי להתחיל מחדש, לחצו על שיחה חדשה בראש המסך."

# Messages that try to change the bot's rules or are off topic: one polite line, the rules stay.
redirect: "אני כאן כדי לעזור לכם להבין איך בחירת רכב החברה משפיעה על הנטו החודשי שלכם, ולהשוות בין האפשרויות לפי הסדרי שטראוס. אפשר לשאול אותי על רכבי החברה, הזכאות וההשפעה על השכר."
injection_patterns: [התעלם, תתעלם, שכח את ההוראות, הוראות המערכת, system prompt, ignore, אתה עכשיו, מעכשיו אתה,
                     תעמיד פנים, jailbreak, תגיד לי את הפרומפט]
off_topic_patterns: [מזג אוויר, בדיחה, מתכון, כדורגל, פוליטיקה, שיר, מניות, ביטקוין]
# What STRAUSS DRIVE is about (22/10). A question nothing here answers is offered to the transport
# representative only when the message names one of these words (a whole word, up to two prefix letters, words
# of three letters or more also as a word start), refers back to the conversation (context_markers), holds an
# amount or a percent, a job title, an FAQ topic or a catalog car; any other question gets the redirect.
# Spelling variants read alike ("אויר" / "אוויר"). New topic = a word here.
context_markers: [זה, זו, זאת, הזה, הזאת, הזו, למה, ולמה, ומה, ואם, אם, ואיך, אז, גם, ביניהם, ביניהן, עליי,
                  בשבילי, אותו, אותה, אותם, שוב, עדיף, תוקף, לשנות, ההבדל, הבדל, הפרש, ההפרש, סופי]
domain_terms: [רכב, מכונית, אוטו, ליסינג, דגם, קטלוג, יצרן, זכאות, זכאי, קבוצה, קבוצת, השתתפות, שווי, נטו,
               ברוטו, שכר, משכורת, תלוש, מס, מיסוי, זיכוי, פנסיה, פנסיונית, השתלמות, בונוס, עמלה, עמלות, אחזקה,
               אחזקת, ויתור, לוותר, חשמלי, היברידי, פלאג, הנעה, דלק, בנזין, טעינה, מטען, קילומטר, קילומטרים,
               ביטוח, תאונה, טסט, רישוי, רישיון, מוסך, תיקון, שטראוס, נציג, תחבורה, מסלול משפחתי, משפחתי, חלופה,
               חלופות, להשוות, השוואה, משתלם, תפקיד, עיסוק, החלפה, להחליף, מסירה, הסדר, הסדרי, הטבה, הטבות,
               ניכוי, הפרשה, הפרשות, עלות, תקציב, הכנסה, מחיר, מחירון, שימוש, צמוד, חניה, כביש]
