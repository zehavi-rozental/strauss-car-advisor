[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "car-advisor"
version = "0.1.0"
description = "יועץ הרכב של שטראוס — בוט שמחשב איך שינוי ברכב הצמוד משפיע על הנטו"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "import-linter>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "acceptance: ששת העובדים לדוגמה של שטראוס",
    "eval: הערכת מודל השפה (רץ מול מודל אמיתי)",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
# הערכה מול מודל אמיתי רצה רק במפורש: pytest -m eval
addopts = "-m 'not eval'"

# כל מודול חושף רק את public.py; מנוע החישוב לא תלוי באף מודול אחר.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "calculation is a pure library"
type = "forbidden"
source_modules = ["app.modules.calculation"]
forbidden_modules = [
    "app.modules.rules",
    "app.modules.vehicles",
    "app.modules.cases",
    "app.modules.conversation",
    "sqlalchemy",
    "fastapi",
]

# allow_indirect_imports: public.py עצמו מייבא את הפנימיים של המודול שלו; נאסר רק ייבוא ישיר.
[[tool.importlinter.contracts]]
name = "modules talk only through public.py"
type = "forbidden"
source_modules = ["app.modules.conversation", "app.modules.cases"]
forbidden_modules = [
    "app.modules.calculation.engine",
    "app.modules.calculation.tax",
    "app.modules.rules.loader",
    "app.modules.vehicles.repository",
    "app.modules.vehicles.models",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the API uses modules only through public.py"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = [
    "app.modules.calculation.engine",
    "app.modules.calculation.tax",
    "app.modules.calculation.models",
    "app.modules.rules.loader",
    "app.modules.rules.models",
    "app.modules.vehicles.repository",
    "app.modules.vehicles.models",
    "app.modules.conversation.agent",
    "app.modules.conversation.tools",
    "app.modules.conversation.stage",
    "app.modules.conversation.repository",
    "app.modules.conversation.models",
    "app.modules.conversation.llm",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the conversation module does not know about HTTP"
type = "forbidden"
source_modules = ["app.modules.conversation"]
forbidden_modules = ["fastapi", "starlette", "app.api"]

# שאלות לנציג: המודול לא מכיר את השיחה (היא נרשמת לאירועים שלו), ולא HTTP
[[tool.importlinter.contracts]]
name = "cases does not know about conversation or HTTP"
type = "forbidden"
source_modules = ["app.modules.cases"]
forbidden_modules = ["app.modules.conversation", "app.api", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "cases is used only through its public.py"
type = "forbidden"
source_modules = ["app.modules.conversation", "app.api"]
forbidden_modules = ["app.modules.cases.models"]
allow_indirect_imports = true
