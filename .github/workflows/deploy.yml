# Controlled deploy to Render. Never automatic: someone presses "Run workflow", and the job waits for the
# approval of the "render-demo" environment (set "Required reviewers" on it in GitHub: Settings > Environments).
#
# It deploys only a commit whose CI run passed, and only when that commit is still the head of the deploy branch
# (a Render deploy hook builds the branch head, so a newer, untested commit must never slip in).
#
# One-time setup (GitHub: Settings > Environments > render-demo):
#   secret RENDER_DEPLOY_HOOK_URL  the service's Deploy Hook (Render: strauss-drive > Settings > Deploy Hook)
#   variable APP_URL               https://strauss-drive.onrender.com
name: Deploy to Render

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: render-demo
    env:
      BRANCH: deploy/render-demo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only from the deploy branch
        if: github.ref_name != 'deploy/render-demo'
        run: |
          echo "::error::run this workflow on deploy/render-demo (it was started on ${{ github.ref_name }})"
          exit 1

      - name: The commit is the branch head and its CI passed
        run: |
          head=$(gh api "repos/${{ github.repository }}/branches/$BRANCH" --jq .commit.sha)
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "::error::the branch moved to $head after this run started: run the workflow again"; exit 1
          fi
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$head&event=push&per_page=1" \
                       --jq '.workflow_runs[0].conclusion // "none"')
          echo "CI on $head: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed on $head ($conclusion): no deploy"; exit 1
          fi

      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::RENDER_DEPLOY_HOOK_URL is not set"; exit 1; fi
          curl -fsS -o /dev/null -X POST "$HOOK"
          echo "deploy of ${{ github.sha }} requested"

      - name: Wait until the new version answers /api/health
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 60); do
            body=$(curl -s -m 30 "${{ vars.APP_URL }}/api/health" || true)
            echo "$body" | grep -q '"status":"ok"' && { echo "$body"; exit 0; }
            sleep 20
          done
          echo "::error::the service did not report healthy within 20 minutes"; exit 1
