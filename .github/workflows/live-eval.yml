# Live LLM checks (paid Gemini calls). Manual only, never on push. The key is the GEMINI_API_KEY secret of the
# "live-llm" environment (GitHub: Settings > Environments); it is never printed (GitHub masks secrets in logs).
#
#   probe   one tiny request per LLM_CHAIN entry: status + latency                     (~2 calls)
#   smoke   probe + Noa Levi end to end through the API with the real model          (~10 calls)
#   spec    the 57-case spec eval set (extraction / tool choice / invented numbers)  (<= 171 calls)
name: Live LLM eval

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "probe | smoke | spec"
        required: true
        default: probe
        type: choice
        options: [probe, smoke, spec]
      only:
        description: "spec only: comma-separated case ids (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-llm
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_CHAIN: gemini:gemini-3.5-flash-lite,gemini:gemini-3.6-flash
      EVAL_MAX_CALLS: "180"
      EVAL_ONLY: ${{ inputs.only }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Probe the chain
        run: python -m app.llm_probe
      - name: Noa Levi end to end
        if: inputs.suite == 'smoke'
        env:
          EVAL_TURN_PAUSE_S: "5"
        run: pytest -m eval tests/eval/test_live_gemini.py -q
      - name: Spec eval set
        if: inputs.suite == 'spec'
        run: pytest -m eval tests/eval/test_spec_eval_live.py -q -s
      - uses: actions/upload-artifact@v4
        if: always() && inputs.suite == 'spec'
        with:
          name: spec-eval-live
          path: backend/spec-eval-live.md
          if-no-files-found: ignore
